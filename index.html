<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independence Hotel - Guest Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#1B365D',
                        gold: '#C5A880',
                    }
                }
            }
        }
    </script>
    <style>
        .star-rating i { color: #e5e7eb; cursor: pointer; transition: color 0.2s; }
        .star-rating i.active, .star-rating i:hover { color: #C5A880; }
    </style>
</head>
<body class="bg-gray-50 h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden mt-4 mb-4">
        <!-- Header & Logo -->
        <div class="bg-navy p-6 text-center">
            <img src="Logo PNG-white.png" alt="Independence Hotel" class="h-16 mx-auto mb-2" onerror="this.src='https://via.placeholder.com/150x50?text=Logo'">
            <h2 class="text-white text-xl font-semibold tracking-wider">GUEST EXPERIENCE SURVEY</h2>
        </div>

        <!-- Form -->
        <form id="feedbackForm" class="p-6 space-y-6">
            <!-- Outlet Selection -->
            <div>
                <label class="block text-sm font-bold text-navy mb-2">Where are you dining or relaxing today? *</label>
                <select id="outlet" required class="w-full border-gray-300 border rounded-md p-3 focus:ring-navy focus:border-navy bg-white text-gray-700">
                    <option value="">-- Please select location --</option>
                    <option value="Sunset Restaurant">Sunset Restaurant</option>
                    <option value="Coral Restaurant (Breakfast)">Coral Restaurant (Breakfast)</option>
                    <option value="History Lounge & Bar">History Lounge & Bar</option>
                    <option value="Ocean Pool">Ocean Pool</option>
                    <option value="Sky Pool Bar">Sky Pool Bar</option>
                    <option value="Beach Bar">Beach Bar</option>
                    <option value="Room Service">Room Service</option>
                    <option value="Banquet / Event">Banquet / Event</option>
                </select>
            </div>

            <hr class="border-gray-200">

            <!-- Ratings Section -->
            <div class="space-y-4">
                
                <!-- Overall -->
                <div class="flex flex-col items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
                    <label class="text-sm font-bold text-navy mb-1">Overall Experience *</label>
                    <div class="flex space-x-2 text-3xl star-rating" data-category="overall">
                        <i class="fas fa-star" data-rating="1"></i>
                        <i class="fas fa-star" data-rating="2"></i>
                        <i class="fas fa-star" data-rating="3"></i>
                        <i class="fas fa-star" data-rating="4"></i>
                        <i class="fas fa-star" data-rating="5"></i>
                    </div>
                    <input type="hidden" id="rating_overall">
                </div>

                <!-- Food & Beverage -->
                <div class="flex flex-col items-center">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Food & Beverage Quality *</label>
                    <div class="flex space-x-1 text-2xl star-rating" data-category="food">
                        <i class="fas fa-star" data-rating="1"></i>
                        <i class="fas fa-star" data-rating="2"></i>
                        <i class="fas fa-star" data-rating="3"></i>
                        <i class="fas fa-star" data-rating="4"></i>
                        <i class="fas fa-star" data-rating="5"></i>
                    </div>
                    <input type="hidden" id="rating_food">
                </div>

                <!-- Staff Service -->
                <div class="flex flex-col items-center">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Staff Service & Speed *</label>
                    <div class="flex space-x-1 text-2xl star-rating" data-category="service">
                        <i class="fas fa-star" data-rating="1"></i>
                        <i class="fas fa-star" data-rating="2"></i>
                        <i class="fas fa-star" data-rating="3"></i>
                        <i class="fas fa-star" data-rating="4"></i>
                        <i class="fas fa-star" data-rating="5"></i>
                    </div>
                    <input type="hidden" id="rating_service">
                </div>

                <!-- Cleanliness & Atmosphere -->
                <div class="flex flex-col items-center">
                    <label class="text-xs font-semibold text-gray-600 mb-1">Cleanliness & Atmosphere *</label>
                    <div class="flex space-x-1 text-2xl star-rating" data-category="cleanliness">
                        <i class="fas fa-star" data-rating="1"></i>
                        <i class="fas fa-star" data-rating="2"></i>
                        <i class="fas fa-star" data-rating="3"></i>
                        <i class="fas fa-star" data-rating="4"></i>
                        <i class="fas fa-star" data-rating="5"></i>
                    </div>
                    <input type="hidden" id="rating_cleanliness">
                </div>

            </div>

            <hr class="border-gray-200">

            <!-- Comments -->
            <div>
                <label class="block text-sm font-bold text-navy mb-2">Any comments or suggestions for us? (Optional)</label>
                <textarea id="comments" rows="3" class="w-full border-gray-300 border rounded-md p-3 focus:ring-navy focus:border-navy text-sm" placeholder="Tell us how we can make your experience even better..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-navy text-white font-bold py-3 px-4 rounded-md hover:bg-opacity-90 transition shadow-md">
                SUBMIT FEEDBACK
            </button>
        </form>
    </div>

    <!-- Script to send data -->
    <script>
        // Setup star click events for all categories
        const starGroups = document.querySelectorAll('.star-rating');
        
        starGroups.forEach(group => {
            const category = group.getAttribute('data-category');
            const input = document.getElementById('rating_' + category);
            const stars = group.querySelectorAll('i');

            stars.forEach(star => {
                star.addEventListener('click', function() {
                    let rating = this.getAttribute('data-rating');
                    input.value = rating;
                    
                    // Reset all stars in this group
                    stars.forEach(s => s.classList.remove('active'));
                    // Highlight selected stars
                    for(let i=0; i<rating; i++) {
                        stars[i].classList.add('active');
                    }
                });
            });
        });

        // Handle Submit
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Validate all stars are clicked
            const rOverall = document.getElementById('rating_overall').value;
            const rFood = document.getElementById('rating_food').value;
            const rService = document.getElementById('rating_service').value;
            const rClean = document.getElementById('rating_cleanliness').value;

            if(!rOverall || !rFood || !rService || !rClean) {
                alert('Please provide a star rating for all categories to help us improve.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "SUBMITTING...";
            submitBtn.disabled = true;

            const data = {
                outlet: document.getElementById('outlet').value,
                rating_overall: rOverall,
                rating_food: rFood,
                rating_service: rService,
                rating_cleanliness: rClean,
                comments: document.getElementById('comments').value
            };

            const webAppUrl = "https://script.google.com/macros/s/AKfycbz5XOsC36BIE29PJksgDMQE1CtOYO9xrtOzX4hi26sLo0l-NBWrlpyzCqPAwixgkWdU/exec";

            fetch(webAppUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(response => {
                submitBtn.innerText = "SUCCESS! THANK YOU";
                submitBtn.classList.remove('bg-navy');
                submitBtn.style.backgroundColor = "#28a745"; 
                
                // Clear Form
                document.getElementById('feedbackForm').reset();
                document.querySelectorAll('.star-rating i').forEach(s => s.classList.remove('active'));
                document.querySelectorAll('input[type="hidden"]').forEach(inp => inp.value = '');

                setTimeout(() => {
                    submitBtn.innerText = "SUBMIT FEEDBACK";
                    submitBtn.style.backgroundColor = "";
                    submitBtn.classList.add('bg-navy');
                    submitBtn.disabled = false;
                }, 3000);
            }).catch(error => {
                console.error(error);
                submitBtn.innerText = "ERROR - TRY AGAIN";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
